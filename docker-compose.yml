services:
  postgres:
    image: postgres:16
    container_name: frontida-postgres
    environment:
      POSTGRES_DB: frontida4baby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontida-web
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=frontida4baby;Username=postgres;Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
    ports:
      - "80:8080"
    restart: unless-stopped

volumes:
  postgres-data:
